apiVersion: v1
kind: Secret
metadata:
  name: kuma-metrics-auth
  namespace: monitoring
type: Opaque
stringData:
  password: ""
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: kuma-uptime
      app.kubernetes.io/name: uptime-kuma
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      basicAuth:
        username: admin
        password:
          secret:
            name: kuma-metrics-auth
            key: password
---
# GMP collector must be allowed to read the auth secret (required for BasicAuth).
# https://cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed#configure-basic-auth
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuma-metrics-auth-read
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kuma-metrics-auth"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gmp-system:collector:kuma-metrics-auth-read
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuma-metrics-auth-read
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: gmp-system

# kubectl delete pod -n gmp-system -l app.kubernetes.io/name=collector

