name: syncer
namespace: monitoring

serviceAccount:
  create: true
  name: grafana


schedule: "*/10 * * * *" # Every 10 minutes
image:
  name: gke.gcr.io/prometheus-engine/datasource-syncer
  pullPolicy: IfNotPresent
  tag: v0.17.2-gke.2


env:
  envTokenName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  secretName: datasource-syncer
  envTokenKey: sa-token