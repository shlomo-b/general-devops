apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 2

      template:
        spec:
          serviceAccountName: {{ .Values.serviceAccount.name }}
          restartPolicy: OnFailure

          containers:
            - name: {{ .Values.name }}
              image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}

              args:
                - "--datasource-uids=gmp-prometheus"
                - "--grafana-api-endpoint=http://grafana.monitoring.svc:80"
                - "--project-id=shlomo-prod"

              env:
                - name: {{ .Values.env.envTokenName }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.env.secretName }}
                      key: {{ .Values.env.envTokenKey }}
        
